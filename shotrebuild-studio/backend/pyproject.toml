[project]
name = "shotrebuild-studio-backend"
version = "0.1.0"
description = "ShotRebuild Studio local backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
